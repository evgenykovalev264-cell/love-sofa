<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Для Софы ❤️</title>
<!-- <script src="https://telegram.org/js/telegram-web-app.js"></script> -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    font-family: 'Georgia', serif;
    background: #000;
  }

  #bg-photo {
    position: fixed;
    inset: 0;
    background-image: url('photo.jpg');
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    z-index: 0;
    filter: brightness(0.7);
  }
  #bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.15) 65%,
      rgba(0,0,0,0.5) 100%
    );
    z-index: 1;
    pointer-events: none;
  }

  #fx-canvas {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  #heart-outer {
    position: fixed;
    top: 55%;
    left: 50%;
    z-index: 2;
    width: clamp(280px, 78vw, 460px);
    height: clamp(280px, 78vw, 460px);
    transform: translate(-50%, -50%);
    filter:
      drop-shadow(0 0 8px rgba(255, 105, 180, 0.9))
      drop-shadow(0 0 24px rgba(255, 105, 180, 0.55))
      drop-shadow(0 0 50px rgba(0, 191, 255, 0.4));
    transition: filter 0.4s ease;
    will-change: filter, transform;
  }
  #heart-outer.tap-pulse {
    filter:
      drop-shadow(0 0 16px rgba(255, 105, 180, 1))
      drop-shadow(0 0 40px rgba(255, 215, 0, 0.9))
      drop-shadow(0 0 80px rgba(0, 191, 255, 0.7));
  }

  #heart-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.25, 1.5, 0.5, 1);
    will-change: transform;
  }
  #heart-wrap.tap-shake {
    animation: heartShake 0.5s ease-out;
  }
  @keyframes heartShake {
    0%   { transform: scale(1)    rotate(0deg);    }
    20%  { transform: scale(1.06) rotate(-1.5deg); }
    40%  { transform: scale(1.02) rotate(1.5deg);  }
    60%  { transform: scale(1.05) rotate(-1deg);   }
    80%  { transform: scale(1.01) rotate(0.8deg);  }
    100% { transform: scale(1)    rotate(0deg);    }
  }

  #sj-letters {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(36px, 12vw, 72px);
    font-weight: bold;
    font-family: 'Brush Script MT', 'Segoe Script', cursive;
    letter-spacing: 4px;
    color: #fff;
    user-select: none;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.95),
      0 0 18px rgba(255, 105, 180, 0.7),
      0 0 30px rgba(255, 215, 0, 0.4);
    background: linear-gradient(90deg, #ff69b4, #ffd700, #00bfff, #ff69b4, #ffd700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: #fff;
    animation: gradientShift 6s linear infinite, gentleSway 3s ease-in-out infinite;
  }
  @keyframes gentleSway {
    0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
    50%      { transform: translate(-50%, -50%) rotate(2deg);  }
  }

  #sj-letters::before {
    content: 'S+J';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    font-weight: inherit;
    background: linear-gradient(90deg, #ff69b4, #ffd700, #00bfff, #ff69b4, #ffd700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    -webkit-text-stroke: 4px transparent;
    z-index: -1;
    animation: gradientShift 6s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.9))
            drop-shadow(0 0 16px rgba(255, 215, 0, 0.6));
  }
  @keyframes gradientShift {
    0%   { background-position:   0% 50%; }
    100% { background-position: 300% 50%; }
  }

  #date {
    position: fixed;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: clamp(13px, 3.2vw, 18px);
    letter-spacing: 6px;
    font-weight: bold;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    animation: dateTwinkle 3s ease-in-out infinite;
  }
  @keyframes dateTwinkle {
    0%, 100% { opacity: 1;    text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    50%      { opacity: 0.85; text-shadow:
                 0 2px 10px rgba(0,0,0,0.9),
                 0 0 18px rgba(255, 105, 180, 0.9),
                 0 0 30px rgba(255, 215, 0, 0.5); }
  }
  #date .heart-mini {
    font-size: 1.1em;
    color: #ff3b6b;
    letter-spacing: 0;
    animation: miniBeat 1.4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes miniBeat {
    0%, 100% { transform: scale(1);    }
    15%      { transform: scale(1.25); }
    30%      { transform: scale(1);    }
    45%      { transform: scale(1.18); }
    60%      { transform: scale(1);    }
  }

  #message {
    position: fixed;
    top: 80%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: clamp(13px, 3.6vw, 19px);
    text-align: center;
    line-height: 1.4;
    max-width: 90%;
    font-style: italic;
    text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    z-index: 3;
    transition: opacity 0.8s ease;
  }
  #message.changing { opacity: 0; }

  #hint {
    position: fixed;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.9);
    font-size: clamp(10px, 2.6vw, 12px);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: bold;
    padding: 10px 22px;
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 3;
    animation: pulseHint 2s ease-in-out infinite;
    white-space: nowrap;
    user-select: none;
  }
  @keyframes pulseHint {
    0%, 100% {
      transform: translateX(-50%) scale(1);
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35);
      opacity: 0.85;
    }
    50% {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 0 0 14px rgba(255, 255, 255, 0);
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div id="bg-photo"></div>
<div id="bg-overlay"></div>

<canvas id="fx-canvas"></canvas>

<div id="heart-outer">
  <div id="heart-wrap">
    <svg id="heart-svg" viewBox="-20 -20 40 40" preserveAspectRatio="xMidYMid meet" style="width:100%; height:100%; display:block;">
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#ff69b4" />
          <stop offset="33%"  stop-color="#ffd700" />
          <stop offset="66%"  stop-color="#00bfff" />
          <stop offset="100%" stop-color="#ff69b4" />
        </linearGradient>
      </defs>
      <path id="heart-path" d="" fill="none" stroke="url(#heartGrad)" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span id="sj-letters">S+J</span>
  </div>
</div>

<div id="date">
  <span>28 . 05 . 25</span>
  <span class="heart-mini">❤️</span>
</div>

<div id="message"></div>

<div id="hint">коснись экрана</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
}

/* ── Контур сердца через SVG ── */
function buildHeartPath() {
  const N = 120;
  const coords = [];
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    coords.push([x, -y]);
  }
  let d = 'M ' + coords[0][0].toFixed(3) + ' ' + coords[0][1].toFixed(3);
  for (let i = 1; i < coords.length; i++) {
    d += ' L ' + coords[i][0].toFixed(3) + ' ' + coords[i][1].toFixed(3);
  }
  d += ' Z';
  return d;
}
document.getElementById('heart-path').setAttribute('d', buildHeartPath());

/* ── Эффекты при тапе ── */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let FW, FH;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resizeFx() {
  FW = window.innerWidth;
  FH = window.innerHeight;
  fxCanvas.width  = FW * dpr;
  fxCanvas.height = FH * dpr;
  fxCanvas.style.width  = FW + 'px';
  fxCanvas.style.height = FH + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeFx);
resizeFx();

class HeartRipple {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.size = 10;
    this.maxSize = Math.min(FW, FH) * 0.55;
    this.life = 1;
    this.decay = 0.022;
    this.color = ['#ff69b4', '#00bfff', '#ffd700', '#ff85c8'][Math.floor(Math.random() * 4)];
    this.lineWidth = 4;
  }
  update() {
    this.size += 9;
    this.life -= this.decay;
    this.lineWidth = Math.max(1, 4 * this.life);
  }
  draw() {
    if (this.life < 0.05) return;
    const N = 60;
    fxCtx.save();
    fxCtx.globalAlpha = this.life * 0.9;
    fxCtx.strokeStyle = this.color;
    fxCtx.lineWidth = this.lineWidth;
    fxCtx.shadowBlur = 22;
    fxCtx.shadowColor = this.color;
    fxCtx.lineJoin = 'round';
    fxCtx.beginPath();
    const unit = this.size / 16;
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const px = this.x + hx * unit;
      const py = this.y - hy * unit;
      if (i === 0) fxCtx.moveTo(px, py);
      else fxCtx.lineTo(px, py);
    }
    fxCtx.closePath();
    fxCtx.stroke();
    fxCtx.restore();
  }
}

class Flash {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 5;
    this.life = 1;
    this.color = ['#ffffff', '#ffd700', '#ff69b4'][Math.floor(Math.random() * 3)];
  }
  update() { this.r += 4; this.life -= 0.06; }
  draw() {
    if (this.life < 0.05) return;
    const g = fxCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g.addColorStop(0, `rgba(255,255,255,${this.life})`);
    g.addColorStop(0.5, `rgba(255, 215, 0, ${this.life * 0.5})`);
    g.addColorStop(1, 'rgba(255, 215, 0, 0)');
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    fxCtx.fillStyle = g;
    fxCtx.fill();
  }
}

class Dot {
  constructor(x, y) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = 3 + Math.random() * 6;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 1;
    this.decay = 0.03 + Math.random() * 0.02;
    this.size = 2 + Math.random() * 3;
    this.color = ['#ff69b4', '#ffd700', '#00bfff', '#ffffff', '#ff85c8'][Math.floor(Math.random() * 5)];
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94;
    this.vy *= 0.94;
    this.life -= this.decay;
  }
  draw() {
    if (this.life < 0.05) return;
    const g = fxCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    g.addColorStop(0, this.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    fxCtx.globalAlpha = this.life;
    fxCtx.fillStyle = g;
    fxCtx.fill();
    fxCtx.globalAlpha = 1;
  }
}

class FloatingHeart {
  constructor(x, y) {
    this.x = x + (Math.random() - 0.5) * 40;
    this.y = y;
    this.vy = -1.5 - Math.random() * 1.5;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.life = 1;
    this.decay = 0.012;
    this.size = 16 + Math.random() * 12;
    this.rot = (Math.random() - 0.5) * 0.4;
    this.rotSpeed = (Math.random() - 0.5) * 0.04;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy *= 0.99;
    this.life -= this.decay;
    this.rot += this.rotSpeed;
  }
  draw() {
    if (this.life < 0.05) return;
    fxCtx.save();
    fxCtx.globalAlpha = this.life;
    fxCtx.translate(this.x, this.y);
    fxCtx.rotate(this.rot);
    fxCtx.font = this.size * 2 + 'px serif';
    fxCtx.textAlign = 'center';
    fxCtx.textBaseline = 'middle';
    fxCtx.fillText('❤️', 0, 0);
    fxCtx.restore();
  }
}

const MAX_RIPPLES = 4;
const MAX_FLASHES = 6;
const MAX_DOTS = 60;
const MAX_HEARTS = 25;

const ripples = [];
const flashes = [];
const dots = [];
const floatHearts = [];

let lastFxFrame = 0;
const FX_INTERVAL = 1000 / 30;

function fxAnimate(now) {
  requestAnimationFrame(fxAnimate);
  if (now - lastFxFrame < FX_INTERVAL) return;
  lastFxFrame = now;

  fxCtx.clearRect(0, 0, FW, FH);

  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].draw();
    if (ripples[i].life <= 0 || ripples[i].size > ripples[i].maxSize) ripples.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].update(); flashes[i].draw();
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }
  for (let i = dots.length - 1; i >= 0; i--) {
    dots[i].update(); dots[i].draw();
    if (dots[i].life <= 0) dots.splice(i, 1);
  }
  for (let i = floatHearts.length - 1; i >= 0; i--) {
    floatHearts[i].update(); floatHearts[i].draw();
    if (floatHearts[i].life <= 0) floatHearts.splice(i, 1);
  }
}
requestAnimationFrame(fxAnimate);

const heartOuter = document.getElementById('heart-outer');
const heartWrap  = document.getElementById('heart-wrap');

function handleTap(x, y) {
  if (ripples.length < MAX_RIPPLES) ripples.push(new HeartRipple(x, y));
  if (flashes.length < MAX_FLASHES) flashes.push(new Flash(x, y));

  for (let i = 0; i < 8; i++) {
    if (dots.length >= MAX_DOTS) break;
    dots.push(new Dot(x, y));
  }
  for (let i = 0; i < 3; i++) {
    if (floatHearts.length >= MAX_HEARTS) break;
    floatHearts.push(new FloatingHeart(x, y));
  }

  heartOuter.classList.remove('tap-pulse');
  void heartOuter.offsetWidth;
  heartOuter.classList.add('tap-pulse');
  setTimeout(() => heartOuter.classList.remove('tap-pulse'), 450);

  heartWrap.classList.remove('tap-shake');
  void heartWrap.offsetWidth;
  heartWrap.classList.add('tap-shake');
  setTimeout(() => heartWrap.classList.remove('tap-shake'), 500);
}
document.addEventListener('pointerdown', e => handleTap(e.clientX, e.clientY));

/* ── Фразы ── */
const MESSAGES = [
  "Ты моё самое любимое сердечко",
  "С тобой каждый день как праздник",
  "Ты моя самая нежная вселенная",
  "Ты причина моей самой тёплой улыбки",
  "С тобой я стал по-настоящему счастлив"
];

const msgEl = document.getElementById('message');
let idx = 0;

function showNext() {
  msgEl.classList.add('changing');
  setTimeout(() => {
    msgEl.textContent = MESSAGES[idx];
    msgEl.classList.remove('changing');
    idx = (idx + 1) % MESSAGES.length;
  }, 800);
}

showNext();
setInterval(showNext, 4500);
</script>

</body>
</html>
